<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>7.º grado — Hipogrifo AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <img id="hipogrifo" src="hipogrifo.png">
    </a-assets>

    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <a-entity
        position="0 0.62 0"

        animation__float="
          property: position;
          from: 0 0.57 0;
          to: 0 0.67 0;
          dur: 1800;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
        "

        animation__pulse="
          property: scale;
          from: 1 1 1;
          to: 1.025 1.025 1.025;
          dur: 2200;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
        "
      >

        <a-image
          src="#hipogrifo"
          position="0 0 0"
          rotation="0 0 0"
          width="1.10"
          height="0.73"
          material="
            transparent: true;
            alphaTest: 0.03;
            side: double;
          "
        >
        </a-image>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
