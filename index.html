<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>7.º grado — Hipogrifo AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent('face-camera', {
      init: function () {
        this.camera = null;
        this.target = new THREE.Vector3();
      },

      tick: function () {
        if (!this.camera) {
          this.camera = document.querySelector('[camera]');
        }

        if (!this.camera) return;

        this.camera.object3D.getWorldPosition(this.target);
        this.el.object3D.lookAt(this.target);
      }
    });
  </script>

</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true;"
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >

    <a-assets>
      <img id="hipogrifo" src="hipogrifo.png">
    </a-assets>

    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- BASE HOLOGRÁFICA -->
      <a-ring
        position="0 0.02 0"
        rotation="-90 0 0"
        radius-inner="0.34"
        radius-outer="0.40"
        material="
          color: #55ccff;
          transparent: true;
          opacity: 0.60;
          side: double;
        "
        animation="
          property: rotation;
          to: -90 0 360;
          dur: 6000;
          loop: true;
          easing: linear;
        "
      ></a-ring>


      <!-- FIGURA FLOTANTE -->
      <a-entity
        position="0 0.62 0"
        face-camera

        animation__float="
          property: position;
          from: 0 0.57 0;
          to: 0 0.67 0;
          dur: 1800;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
        "

        animation__pulse="
          property: scale;
          from: 1 1 1;
          to: 1.025 1.025 1.025;
          dur: 2200;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
        "
      >

        <!-- halo suave -->
        <a-image
          src="#hipogrifo"
          position="0 0 -0.025"
          width="1.03"
          height="0.687"
          material="
            transparent: true;
            alphaTest: 0.02;
            opacity: 0.18;
            side: double;
          "
          scale="1.04 1.04 1.04"
        ></a-image>


        <!-- imagen principal -->
        <a-image
          src="#hipogrifo"
          position="0 0 0"
          width="1"
          height="0.667"
          material="
            transparent: true;
            alphaTest: 0.03;
            side: double;
          "
        ></a-image>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
