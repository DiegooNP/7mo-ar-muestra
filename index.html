<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>7.º grado — Hipogrifo AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <img id="hipogrifo" src="hipogrifo.png">
    </a-assets>

    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <a-entity
        position="0 0.58 0"
        animation__float="
          property: position;
          from: 0 0.54 0;
          to: 0 0.64 0;
          dur: 1800;
          dir: alternate;
          loop: true;
          easing: easeInOutSine"
        animation__pulse="
          property: scale;
          from: 1 1 1;
          to: 1.035 1.035 1.035;
          dur: 2200;
          dir: alternate;
          loop: true;
          easing: easeInOutSine"
      >

        <!-- Vista principal -->
        <a-image
          src="#hipogrifo"
          position="0 0 0"
          width="1.15"
          height="0.77"
          material="
            transparent: true;
            alphaTest: 0.03;
            side: double;
          "
        ></a-image>

        <!-- Vista cruzada para dar volumen aparente -->
        <a-image
          src="#hipogrifo"
          position="0 0 0"
          rotation="0 90 0"
          width="1.15"
          height="0.77"
          material="
            transparent: true;
            alphaTest: 0.03;
            side: double;
            opacity: 0.88;
          "
        ></a-image>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
