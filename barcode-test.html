<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>7.º grado — Prueba AR 01 y 02</title>

<body style="margin:0; overflow:hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
      detectionMode: mono_and_matrix;
      matrixCodeType: 4x4_BCH_13_5_5;

    <!-- ===================================================== -->
    <!-- RECURSOS DEL PROYECTO                                 -->
    <!-- ===================================================== -->

    <a-assets>

      <!-- OBRA 01 -->
      <img
        id="hipogrifo"

      <!-- OBRA 02 -->

      <!-- OBRA 03 -->

    <!-- ===================================================== -->
    <!-- MARCADOR 01 — HIPOGRIFO                               -->
    <!-- ===================================================== -->

    <a-marker
      type="barcode"
      value="1"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- LUZ CENTRAL -->
      <a-circle
        position="0 0.01 0"
        rotation="-90 0 0"
        radius="0.34"
        material="
          color: #00cfff;
          shader: flat;
          transparent: true;
          opacity: 0.20;
          side: double;
        "
        animation__glow="
          property: material.opacity;
          from: 0.12;
          to: 0.32;
          dur: 1600;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
        "
      ></a-circle>

      <!-- ARO EXTERIOR -->
      <a-ring
        position="0 0.018 0"
        rotation="-90 0 0"
        radius-inner="0.36"
        radius-outer="0.45"

          color: #00d9ff;
          shader: flat;
          transparent: true;
          opacity: 0.95;
          side: double;
        "
        animation__outer="
          property: scale;
          from: 0.92 0.92 0.92;
          to: 1.10 1.10 1.10;
          dur: 1800;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;

          transparent: true;

        position="0 0.026 0"

          shader: flat;
          transparent: true;

          side: double;

            side: double;
